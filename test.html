<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IEA CoAct Central Resource Finder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FFFFFF;
    --surface:#FFFFFF;
    --ink:#26262B;
    --ink-soft:#6E6E76;
    --border:#E7E4DC;
    --border-strong:#D6D2C7;
    --teal:#218F87;
    --magenta:#8E3480;
    --gold:#C98A1E;
    --orange:#D9502B;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Inter', sans-serif;
    line-height:1.55;
  }
  h1,h2,.brand-word,.pill,.badge,.quick-chip,.startover{
    font-family:'Poppins', sans-serif;
  }
  .wrap{max-width:880px; margin:0 auto; padding:0 20px 70px;}

  .hero{padding:16px 0 2px;}
  .brandrow{display:flex; align-items:center; gap:10px; margin-bottom:10px;}
  .brand-word{font-size:14px; font-weight:600; color:var(--ink-soft);}
  .iea-badge{
    font-size:12px;
    font-weight:600;
    color:#fff;
    background:var(--magenta);
    padding:4px 10px;
    border-radius:20px;
  }
  h1{font-size:23px; font-weight:700; margin:0 0 5px; letter-spacing:-0.01em;}
  .hero p{color:var(--ink-soft); font-size:14px; margin:0; max-width:58ch;}
  .hero p strong{color:var(--ink); font-weight:600;}

  section{margin:14px 0;}
  .section-label{
    font-size:13px;
    font-weight:600;
    color:var(--ink);
    margin:0 0 8px;
  }

  .quick-grid{display:flex; flex-wrap:wrap; gap:8px;}
  .quick-chip{
    display:inline-flex;
    align-items:center;
    gap:8px;
    background:var(--surface);
    border:1px solid var(--border);
    color:var(--ink);
    font-size:13px;
    font-weight:500;
    padding:8px 14px 8px 10px;
    border-radius:24px;
    cursor:pointer;
    transition:border-color .12s ease, box-shadow .12s ease;
  }
  .quick-chip:hover{border-color:var(--border-strong); box-shadow:0 1px 4px rgba(0,0,0,.05);}
  .quick-chip:focus-visible{outline:2px solid var(--ink); outline-offset:2px;}
  .quick-dot{width:9px; height:9px; border-radius:50%; flex-shrink:0;}

  .phase-row{display:flex; flex-wrap:wrap; gap:10px;}
  .phase-btn{
    font-size:13.5px;
    font-weight:600;
    color:#fff;
    border:none;
    padding:10px 20px;
    border-radius:24px;
    cursor:pointer;
    opacity:.55;
    transition:opacity .12s ease, transform .08s ease;
  }
  .phase-btn:hover{opacity:.85;}
  .phase-btn[data-active="true"]{opacity:1;}
  .phase-btn:focus-visible{outline:2px solid var(--ink); outline-offset:2px;}
  .phase-btn[data-phase="Connect"]{background:var(--teal);}
  .phase-btn[data-phase="Grow"]{background:var(--magenta);}
  .phase-btn[data-phase="Prepare"]{background:var(--gold);}
  .phase-btn[data-phase="Support"]{background:var(--orange);}

  .search-input{
    width:100%;
    font-family:'Inter', sans-serif;
    font-size:15px;
    padding:13px 16px;
    border:1.5px solid var(--border-strong);
    border-radius:10px;
    background:var(--surface);
    color:var(--ink);
  }
  .search-input:focus-visible{outline:2px solid var(--ink); outline-offset:1px;}

  .prompt-card{
    border:1.5px dashed var(--border-strong);
    border-radius:14px;
    padding:36px 24px;
    text-align:center;
    color:var(--ink-soft);
    font-size:14px;
  }
  .prompt-card svg{margin-bottom:10px; opacity:.55;}

  .refine-row{
    display:flex;
    flex-wrap:wrap;
    align-items:center;
    gap:10px;
    justify-content:space-between;
    margin-bottom:16px;
  }
  .refine-selects{display:flex; flex-wrap:wrap; gap:8px;}
  select{
    font-family:'Inter', sans-serif;
    font-size:13px;
    font-weight:500;
    padding:8px 10px;
    border-radius:8px;
    border:1px solid var(--border-strong);
    background:var(--surface);
    color:var(--ink);
  }
  .startover{
    font-size:13px;
    font-weight:600;
    color:var(--ink-soft);
    background:none;
    border:1px solid var(--border);
    border-radius:20px;
    padding:8px 16px;
    cursor:pointer;
  }
  .startover:hover{border-color:var(--border-strong); color:var(--ink);}

  .count-row{font-size:13px; color:var(--ink-soft); margin-bottom:12px;}
  .task-row{font-size:14px; color:var(--ink); margin-bottom:4px;}
  .task-row strong{font-weight:600;}

  .results{display:flex; flex-direction:column; gap:10px;}
  .row{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:14px;
    padding:16px 18px;
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:16px;
  }
  .row-main{min-width:0; flex:1;}
  .badge{
    display:inline-block;
    font-size:11px;
    font-weight:700;
    letter-spacing:.03em;
    color:#fff;
    padding:3px 9px;
    border-radius:6px;
    margin-bottom:9px;
  }
  .badge[data-phase="Connect"]{background:var(--teal);}
  .badge[data-phase="Grow"]{background:var(--magenta);}
  .badge[data-phase="Prepare"]{background:var(--gold);}
  .badge[data-phase="Support"]{background:var(--orange);}

  .theme-label{
    display:block;
    font-size:14px;
    font-weight:600;
    color:var(--ink);
    margin:0 0 6px;
  }
  .resource-tag{
    display:inline-block;
    font-size:15px;
    font-weight:600;
    color:var(--ink);
    background:var(--bg);
    border:1px solid var(--border);
    border-radius:8px;
    padding:6px 10px;
    margin-bottom:9px;
    word-break:break-word;
  }
  .meta-tags{display:flex; flex-wrap:wrap; gap:6px;}
  .meta-tag{
    font-size:11.5px;
    color:var(--ink-soft);
    background:var(--bg);
    border:1px solid var(--border);
    border-radius:6px;
    padding:3px 8px;
  }

  .row-actions{display:flex; flex-direction:column; gap:8px; flex-shrink:0;}
  .open-btn{
    font-family:'Poppins', sans-serif;
    font-size:13px;
    font-weight:600;
    padding:9px 16px;
    border-radius:20px;
    border:1.5px solid var(--teal);
    background:var(--teal);
    color:#fff;
    text-decoration:none;
    text-align:center;
    white-space:nowrap;
  }
  .open-btn{display:inline-flex; align-items:center; justify-content:center; gap:6px;}
  .open-btn:hover{background:#1a766f; border-color:#1a766f;}
  .resource-link{text-decoration:none; cursor:pointer;}
  .resource-link:hover{color:var(--teal); border-color:var(--teal); text-decoration:underline;}
  .resource-link:focus-visible{outline:2px solid var(--ink); outline-offset:2px;}
  .open-btn:focus-visible{outline:2px solid var(--ink); outline-offset:2px;}
  .note{
    font-size:13.5px;
    color:var(--ink);
    background:#FBF6EC;
    border-left:3px solid var(--gold);
    border-radius:6px;
    padding:8px 12px;
    margin:0 0 9px;
  }
  .note strong{font-weight:600;}


  @media (max-width:600px){
    .row{flex-direction:column;}
    .row-actions{width:100%;}
    .refine-row{flex-direction:column; align-items:flex-start;}
  }
</style>
</head>
<body>

<div class="wrap">

  <div class="hero">
    <div class="brandrow">
      <span class="brand-word">CoAct Connect: Inclusive Employment Australia</span>
    </div>
    <h1>IEA CoAct Central Resource Finder</h1>
    <p>Pick a task, a phase, or start typing. Once you've found what you need, <strong>open it in CoAct Central</strong> with one click.</p>
  </div>

  <section id="quickfindWrap">
    <p class="section-label">What are you trying to do?</p>
    <div class="quick-grid" id="quickfind"></div>
  </section>

  <section>
    <p class="section-label">Or jump straight to a phase</p>
    <div class="phase-row" id="phaseRow"></div>
  </section>

  <section>
    <p class="section-label">Or search directly</p>
    <input type="text" class="search-input" id="search" placeholder="Search by resource name, theme or system…" autocomplete="off">
  </section>

  <section id="outputArea"></section>

</div>

  {phase:"Support", theme:"Placement Management", resource:"Track Placement Progress", system:"JobReady", role:"WRC / MS ESC", url:"https://central.coact.org.au/documents-all/track-placement-progress"},
  {phase:"Support", theme:"Progress Monitoring", resource:"Client Dashboard", system:"Campus", role:"All Role Families", url:"https://central.coact.org.au/documents-iea/client-dashboard"},
  {phase:"Support", theme:"Support Management", resource:"Retention Support – Post Placement Support (PPS) Conversation Guide", system:"General", role:"WRC / MS ESC", url:"https://central.coact.org.au/all-bestpracticeguides/retention-support-pps-questions"},
  {phase:"Support", theme:"Support Management", resource:"Job Ready – Support Tracker and Support Schedule", system:"JobReady", role:"WRC / MS ESC", url:"https://central.coact.org.au/documents-all/job-ready-support-tracker-and-support-schedule"},
  {phase:"Support", theme:"Support Management", resource:"Work Instructions – Job Ready Alerts Dashboard", system:"JobReady", role:"WRC / MS ESC", url:"https://central.coact.org.au/documents-all/work-instructions-job-ready-alerts-dashboard"},
];

const QUICKFIND = [
  {label:"Register or onboard a client", phase:"Connect", phases:["Connect"], themes:["Eligibility & Registration","Client Records","Welcome & Activation"]},
  {label:"Complete intake or initial appointment prep", phase:"Connect", phases:["Connect"], themes:["Intake & Onboarding","Commencement Preparation","Initial Appointment","Appointment Management"]},
  {label:"Assess needs, build a plan or manage barriers", phase:"Grow", themes:["Assessment & Planning","Activity & Intervention Management"]},
  {label:"Create or review the Career Action Plan", phase:"Grow", themes:["Career Planning"]},
  {label:"Prepare applications, match jobs or engage employers", phase:"Prepare", phases:["Prepare"], themes:["Job Readiness","Employer Engagement","Employment Tools"]},
  {label:"Progress placement evidence or claims", phase:"Prepare", themes:["Claims & Evidence","Placement Management"]},
  {label:"Manage in-work and ongoing support", phase:"Support", themes:["Support Management","Progress Monitoring"]},
  {label:"Access Employment Assistance Fund (EAF) support", phase:"Support", themes:["Funding Support"]},
];

const state = {phase:null, quick:null, system:"All", role:"All", query:""};

function splitTokens(str){ return str.split('/').map(s=>s.trim()); }
function uniqueSorted(list){ return Array.from(new Set(list)).sort(); }
function hasSelection(){ return state.phase !== null || state.quick !== null || state.query.trim() !== ""; }

function inQuick(row, q){
  if(q.phases && !q.phases.includes(row.phase)) return false;
  return q.themes.includes(row.theme);
}

// Resources that appear in several phases are shown once, with every phase badge and role combined.
function mergeByResource(rows){
  const byName = new Map();
  rows.forEach(r=>{
    const m = byName.get(r.resource);
    if(!m){ byName.set(r.resource, {...r, phases:[r.phase], roleTokens:splitTokens(r.role)}); return; }
    if(!m.phases.includes(r.phase)) m.phases.push(r.phase);
    splitTokens(r.role).forEach(t=>{ if(!m.roleTokens.includes(t)) m.roleTokens.push(t); });
  });
  return Array.from(byName.values()).map(m=>({...m, role:m.roleTokens.join(' / ')}));
}

function pool(){
  if(state.quick !== null) return mergeByResource(DATA.filter(r=>inQuick(r, QUICKFIND[state.quick])));
  return DATA.map(r=>({...r, phases:[r.phase]}));
}

function buildQuickFind(){
  const el = document.getElementById('quickfind');
  el.innerHTML = QUICKFIND.map((q,i)=>
    `<button class="quick-chip" data-idx="${i}"><span class="quick-dot" style="background:${PHASE_COLORS[q.phase]}"></span>${q.label}</button>`
  ).join('');
  el.querySelectorAll('.quick-chip').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      state.quick = Number(btn.dataset.idx);
      state.phase = null;
      state.system = "All";
      state.role = "All";
      state.query = "";
      document.getElementById('search').value = "";
      renderPhaseRow();
      renderOutput();
    });
  });
}

function renderPhaseRow(){
  const phases = ["Connect","Grow","Prepare","Support"];
  const el = document.getElementById('phaseRow');
  el.innerHTML = phases.map(p=>
    `<button class="phase-btn" data-phase="${p}" data-active="${state.phase===p}">${p}</button>`
  ).join('');
  el.querySelectorAll('.phase-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      state.phase = (state.phase === btn.dataset.phase) ? null : btn.dataset.phase;
      state.quick = null;
      renderPhaseRow();
      renderOutput();
    });
  });
}

function matches(row){
  if(state.phase !== null && !row.phases.includes(state.phase)) return false;
  if(state.system !== "All" && !splitTokens(row.system).includes(state.system)) return false;
  if(state.role !== "All"){
    const roles = splitTokens(row.role);
    if(!roles.includes(state.role) && row.role !== "All Role Families") return false;
  }
  if(state.query){
    const hay = (row.theme+' '+row.resource+' '+row.system+' '+row.role+' '+row.phases.join(' ')).toLowerCase();
    if(!hay.includes(state.query.toLowerCase())) return false;
  }
  return true;
}

function renderOutput(){
  const quickfindWrap = document.getElementById('quickfindWrap');

  if(hasSelection()){
    quickfindWrap.style.display = 'none';
  }else{
    quickfindWrap.style.display = '';
  }

  const area = document.getElementById('outputArea');

  if(!hasSelection()){
    area.innerHTML = `
      <div class="prompt-card">
        <svg width="30" height="30" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="10.5" cy="10.5" r="6.5" stroke="#6E6E76" stroke-width="1.6"/>
          <line x1="15.3" y1="15.3" x2="21" y2="21" stroke="#6E6E76" stroke-width="1.6" stroke-linecap="round"/>
        </svg>
        <div>Pick a task, choose a phase, or start typing above to see matching resources.</div>
      </div>`;
    return;
  }

  const rows = pool();
  const scope = rows.filter(r=>state.phase===null || r.phases.includes(state.phase));
  const systems = uniqueSorted(scope.flatMap(r=>splitTokens(r.system)));
  const roles = uniqueSorted(scope.flatMap(r=>splitTokens(r.role)));
  const filtered = rows.filter(matches);

  area.innerHTML = `
    <div class="refine-row">
      <div class="refine-selects">
        <select id="systemFilter">
          <option value="All">All systems</option>
          ${systems.map(s=>`<option value="${s}" ${state.system===s?'selected':''}>${s}</option>`).join('')}
        </select>
        <select id="roleFilter">
          <option value="All">All roles</option>
          ${roles.map(r=>`<option value="${r}" ${state.role===r?'selected':''}>${r}</option>`).join('')}
        </select>
      </div>
      <button class="startover" id="startOver">Start over</button>
    </div>
    ${state.quick!==null ? `<div class="task-row">Showing resources for: <strong>${QUICKFIND[state.quick].label}</strong></div>` : ''}
    <div class="count-row">${filtered.length} resource${filtered.length===1?'':'s'} found</div>
    <div class="results">
      ${filtered.length===0 ? `<div class="prompt-card">No matches. Try clearing a filter or the search box.</div>` :
        filtered.map(r=>`
          <div class="row">
            <div class="row-main">
              ${r.phases.map(p=>`<span class="badge" data-phase="${p}">${p.toUpperCase()}</span>`).join(' ')}<br>
              <span class="theme-label">${r.theme}</span>
              ${r.url ? `<a class="resource-tag resource-link" href="${r.url}" target="_blank" rel="noopener">${r.resource}</a>` : `<span class="resource-tag">${r.resource}</span>`}
              ${r.note ? `<div class="note"><strong>How to find it:</strong> ${r.note}</div>` : ''}
              <div class="meta-tags">
                <span class="meta-tag"><strong>SYSTEM:</strong> ${r.system}</span>
                <span class="meta-tag"><strong>PRIMARY ROLE:</strong> ${r.role}</span>
              </div>
            </div>
            ${r.url ? `<div class="row-actions"><a class="open-btn" href="${r.url}" target="_blank" rel="noopener">Open resource<svg width="14" height="14" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></a></div>` : ''}
          </div>
        `).join('')
      }
    </div>
  `;

  document.getElementById('systemFilter').addEventListener('change', e=>{ state.system = e.target.value; renderOutput(); });
  document.getElementById('roleFilter').addEventListener('change', e=>{ state.role = e.target.value; renderOutput(); });
  document.getElementById('startOver').addEventListener('click', ()=>{
    state.phase = null; state.quick = null; state.system = "All"; state.role = "All"; state.query = "";
    document.getElementById('search').value = "";
    renderPhaseRow();
    renderOutput();
  });
}

document.getElementById('search').addEventListener('input', e=>{
  state.query = e.target.value;
  renderOutput();
});

buildQuickFind();
renderPhaseRow();
renderOutput();
</script>
</body>
</html>
